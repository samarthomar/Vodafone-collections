","Next best action","Priya Shah note, 16 Oct"]},emailToSarah:{subject:"Your dispute on M-0926, and invoices F-0826 and F-0926",text:`Dear Sarah,

onse after 2 or more contact attempts over 10 days: escalate to the account manager, then the team leader.","Next best action"),F("BR-N10","Promise broken","Re-triage and contact the decision maker, not just the AP team.","Next best action"),F("BR-N11","Restriction review","Over 45 days overdue with no dispute, no blocker and no response: offer a restriction review. Never for critical services without extra approval.","Restriction"),F("BR-N12","Collector stays in control","Every action shows why, the evidence and the cash impact. The collector can accept, edit or reject it; rejecting needs a reason.","Next best action"),F("BR-N13","Order of actions","Risk and legal steps first, then fixing our own error (BR-P05), then cash that can be paid now, then cash that needs a fix first, then relationship and protection steps by date, then monitoring. Added during the build; BRD to be updated.","Next best action")]},{title:"Account manager",intro:"What each account manager response does, and its guardrails.",rules:[F("BR-A01","I'll contact the customer","Creates an account manager task with a due date. The collector carries on with admin and dispute work.","Priya’s phone"),F("BR-A02","Proceed, I’m aware","The collector leads all contact. The account manager is copied on the outcome.","Priya’s phone"),F("BR-A03","Request hold","Pauses outbound contact for up to 5 working days (assumption). The team leader sees every hold.","Priya’s phone"),F("BR-A04","Escalate to my manager","Adds the sales manager to the case.","Priya’s phone"),F("BR-A05","A hold is not a pause on the debt","A hold pauses outbound contact only. It never removes the debt from reporting or stops dispute work.","Holds"),F("BR-A06","Holds expire","Holds end automatically. Repeated holds on the same account are flagged to the team leader.","Holds"),F("BR-A07","Account managers cannot credit","The account manager cannot write off, credit or approve arrangements.","Account manager panel"),F("BR-A08","No reply escala
